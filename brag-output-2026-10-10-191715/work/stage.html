<!doctype html>
<html lang="pt-BR">

<style>

  *, *::before, *::after { box-sizing: border-box; transition: none !important; animation: none !important; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #fff; font-family: Inter, system-ui, sans-serif; color: var(--tinta); }
  .abs { position: absolute; }

  /* janela do app */
  #win { position: absolute; border-radius: 22px; overflow: hidden; background: var(--papel2); border: 1px solid var(--fio);
    box-shadow: 0 40px 90px rgb(17 17 17 / .12), 0 8px 24px rgb(17 17 17 / .06); will-change: transform, opacity; }
  #view { position: absolute; inset: 0; overflow: hidden; }
  #view img { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform, opacity; image-rendering: auto; }

  .cap-titulo { margin-top: 26px; font-size: 70px; line-height: 1.05; font-weight: 600; letter-spacing: -.045em; }
  .cap-sub { margin-top: 26px; font-size: 30px; line-height: 1.4; color: var(--suave); letter-spacing: -.01em; }

  /* revelação */

  #reveal p { position: absolute; left: 0; right: 0; top: 458px; margin: 0; text-align: center; font-size: 34px; color: var(--suave); letter-spacing: -.012em; }
  #chips { position: absolute; left: 210px; right: 210px; top: 590px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .chip { display: flex; align-items: center; gap: 14px; height: 76px; padding: 0 22px; border: 1px solid var(--fio); border-radius: 16px; background: #fff; box-shadow: 0 8px 22px rgb(17 17 17 / .05); font-size: 23px; font-weight: 600; letter-spacing: -.02em; will-change: transform, opacity; }
  .chip span { font-size: 15px; font-weight: 700; color: var(--marca); letter-spacing: .06em; }

  /* telefone */
  #phone { position: absolute; width: 418px; height: 872px; border-radius: 62px; background: #111; padding: 14px; box-shadow: 0 50px 100px rgb(17 17 17 / .25), 0 10px 30px rgb(17 17 17 / .12); will-change: transform, opacity; }
  #phscreen { position: relative; width: 390px; height: 844px; border-radius: 48px; overflow: hidden; background: #fff; }
  #phscreen img { position: absolute; left: 0; top: 0; width: 390px; will-change: transform, opacity; }

  /* desfecho */
  #outro { position: absolute; inset: 0; background: #000; }
  #outro .logo { position: absolute; left: 50%; top: 372px; height: 150px; transform: translateX(-50%); color: #fff; fill: #fff; }
  #outro .regua { position: absolute; left: 50%; top: 576px; height: 4px; background: var(--marca); transform: translateX(-50%); }
  #outro .l1 { position: absolute; left: 0; right: 0; top: 616px; text-align: center; color: #fff; font-size: 58px; font-weight: 600; letter-spacing: -.035em; }
  #outro .l2 { position: absolute; left: 0; right: 0; top: 704px; text-align: center; color: #C9CDD1; font-size: 27px; font-weight: 500; letter-spacing: .01em; }
  #outro .l2 b { color: var(--marca); padding: 0 10px; }
  #faixa { position: absolute; top: -200px; height: 1480px; width: 900px; background: var(--marca); transform-origin: 50% 50%; will-change: transform; }

  #cursor { position: absolute; left: 0; top: 0; width: 44px; height: 44px; z-index: 50; pointer-events: none; will-change: transform, opacity; }
  #pulso { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; border: 3px solid var(--marca); z-index: 49; will-change: transform, opacity; }

function retangulo(t) {
  // Gancho em tela cheia; depois a janela ao lado da legenda; some antes do celular.
  if (t < 4.8) return { r: CHEIA, o: 1, s: 1, dx: 0 };
  if (t < 5.25) { const p = eio(prog(t, 4.8, 5.25)); return { r: CHEIA, o: 1 - p, s: 1 - 0.08 * p, dx: 0 }; }

function cameraEm(t, r) {

  cx = 1440 <= 2 * mw ? 720 : clamp(cx, mw, 1440 - mw);
  cy = 900 <= 2 * mh ? 450 : clamp(cy, mh, 900 - mh);
  return { cx, cy, z };
}

  for (let k = 0; k < IMAGENS.length; k++) if (t >= IMAGENS[k].t - 1e-6) i = k;
  return i;
}

    const i = imagemEm(t), atual = IMAGENS[i], ant = IMAGENS[i - 1];
    for (const im of Object.values(cache)) if (im.parentNode === $('#view')) im.style.display = 'none';
    const pos = (n, opacidade) => { const im = cache[n]; im.style.display = 'block'; im.style.opacity = opacidade; im.style.width = 1440 * cam.z + 'px';
      im.style.transform = `translate(${r.w / 2 - cam.cx * cam.z}px, ${r.h / 2 - cam.cy * cam.z}px)`; };
    // Troca dentro da cena: some a anterior, entra a nova (sem dupla exposição); digitação é corte seco.
    const dt = t - atual.t, entra = atual.corte ? 1 : eout(prog(dt, 0.08, 0.3));
    if (ant && !atual.corte && dt < 0.1 && cenaDe(ant.t) === cenaDe(atual.t) && ant.img !== atual.img) pos(ant.img, 1 - prog(dt, 0, 0.08));
    pos(atual.img, entra);
    // anéis
    const view = $('#view');
    view.querySelectorAll('.anel').forEach((a) => a.remove());
    for (const a of ANEIS) {
      if (t < a.t0 || t > a.t1) continue;
      const pin = eoutq(prog(t, a.t0, a.t0 + 0.3)), pout = 1 - prog(t, a.t1 - 0.2, a.t1);
      const d = document.createElement('div'); d.className = 'anel';
      const x = r.w / 2 + (a.x - 8 - cam.cx) * cam.z, y = r.h / 2 + (a.y - 6 - cam.cy) * cam.z;
      Object.assign(d.style, { left: x + 'px', top: y + 'px', width: (a.w + 16) * cam.z + 'px', height: (a.h + 12) * cam.z + 'px',
        opacity: Math.min(pin, pout), transform: `scale(${lerp(1.06, 1, pin)})`, transformOrigin: '50% 50%' });
      view.appendChild(d);
    }
    // cursor
    const cur = $('#cursor'), pulso = $('#pulso');
    cur.style.opacity = 0; pulso.style.opacity = 0;
    for (const c of CURSOR) {
      if (t < c.t0 - 0.25 || t > c.some) continue;
      const p = eio(prog(t, c.t0, c.t1));
      const [sx, sy] = [lerp(c.de[0], c.para[0], p), lerp(c.de[1], c.para[1], p)];
      const [x, y] = naTela(cam, W.r, sx, sy);
      const aperto = t > c.clique - 0.06 && t < c.clique + 0.1 ? 0.86 : 1;
      cur.style.opacity = Math.min(prog(t, c.t0 - 0.25, c.t0), 1 - prog(t, c.some - 0.2, c.some)) * W.o;
      cur.style.transform = `translate(${x - 9}px, ${y - 5}px) scale(${aperto})`;
      const pc = prog(t, c.clique, c.clique + 0.45);
      if (pc > 0 && pc < 1) { pulso.style.opacity = (1 - pc) * 0.9; pulso.style.transform = `translate(${x}px, ${y}px) scale(${lerp(0.3, 1.3, eout(pc))})`; }
    }
  } else { win.style.display = 'none'; $('#cursor').style.opacity = 0; $('#pulso').style.opacity = 0; }

  // legenda
  const cena = CENAS.find((c) => t >= c.t0 && t < c.t1);
  const cap = $('#cap');
  if (cena) {
    cap.style.display = 'block';
    $('#capRot span').textContent = cena.rot; $('#capTit').textContent = cena.tit; $('#capSub').textContent = cena.sub;
    const parte = (el, atraso) => {
      const pin = eoutq(prog(t, cena.t0 + atraso, cena.t0 + atraso + 0.45)), pout = ein(prog(t, cena.t1 - 0.32, cena.t1 - 0.05));
      el.style.opacity = pin * (1 - pout);
      el.style.transform = `translateY(${22 * (1 - pin) - 16 * pout}px)`;
    };
    parte($('#capRot'), 0.12); parte($('#capTit'), 0.22); parte($('#capSub'), 0.36);
  } else cap.style.display = 'none';

  // revelação
  const rv = $('#reveal');
  if (t >= 4.95 && t < 8.45) {
    rv.style.display = 'block';
    const sai = ein(prog(t, 8.05, 8.35));
    const ent = (el, a, dy = 26) => { const p = eoutq(prog(t, a, a + 0.5)); el.style.opacity = p * (1 - sai); el.style.transform = `translateY(${dy * (1 - p) - 20 * sai}px)`; };
    ent($('#reveal .rot'), 5.0); ent($('#reveal h1'), 5.1, 34); ent($('#reveal p'), 5.35);
    document.querySelectorAll('.chip').forEach((c, k) => {
      const a = 5.75 + k * 0.11, p = back(clamp(prog(t, a, a + 0.42)));
      c.style.opacity = clamp(prog(t, a, a + 0.2)) * (1 - sai);
      c.style.transform = `translateY(${(1 - p) * 30 - 20 * sai}px) scale(${lerp(0.94, 1, clamp(p))})`;
    });
  } else rv.style.display = 'none';

  // celular
  const ph = $('#phone');
  if (t >= 37.15 && t < 40.85) {
    ph.style.display = 'block';
    const ent = eoutq(prog(t, 37.2, 37.75)), sai = ein(prog(t, 40.55, 40.8));
    Object.assign(ph.style, { left: '1080px', top: (104 + 70 * (1 - ent)) + 'px', opacity: ent * (1 - sai) });
    const A = cache['cel-res'], B = cache['cel-juizo'];
    // A tela não rola (o cabeçalho fixo faz parte da captura): a segunda entra por baixo.
    const troca = eio(prog(t, 38.95, 39.4));
    A.style.transform = `translateY(${-160 * troca}px)`; A.style.opacity = 1 - troca;
    B.style.transform = `translateY(${220 * (1 - troca)}px)`; B.style.opacity = troca;
  } else ph.style.display = 'none';

  // desfecho: a diagonal varre para o preto
  const fx = $('#faixa'), ou = $('#outro');
  if (t >= 40.3) {
    const p = eio(prog(t, 40.45, 41.15));
    fx.style.display = 'block';
    fx.style.left = lerp(-1100, 2200, p) + 'px';
    fx.style.transform = 'skewX(-45deg)';
    fx.style.opacity = p >= 1 ? 0 : 1;
  } else fx.style.display = 'none';
  if (t >= 40.8) {
    ou.style.display = 'block';
    ou.style.clipPath = `polygon(0 0, ${lerp(0, 160, eio(prog(t, 40.8, 41.1)))}% 0, ${lerp(-60, 100, eio(prog(t, 40.8, 41.1)))}% 100%, 0 100%)`;
    const pl = eoutq(prog(t, 41.15, 41.7));
    const logo = $('#outro .logo'); logo.style.opacity = pl; logo.style.transform = `translateX(-50%) scale(${lerp(0.92, 1, pl)})`;
    $('#outro .regua').style.width = 260 * eio(prog(t, 41.45, 41.95)) + 'px';
    const l1 = eoutq(prog(t, 41.7, 42.15)), l2 = eoutq(prog(t, 42.0, 42.45));
    $('#outro .l1').style.opacity = l1; $('#outro .l1').style.transform = `translateY(${18 * (1 - l1)}px)`;
    $('#outro .l2').style.opacity = l2; $('#outro .l2').style.transform = `translateY(${14 * (1 - l2)}px)`;
  } else ou.style.display = 'none';
}
function cenaDe(t) { return CENAS.findIndex((c) => t >= c.t0 && t < c.t1); }

window.render = render;
Promise.all([...nomes.map(carregar), document.fonts.ready]).then(async () => {
  await Promise.all(Object.values(cache).map((im) => im.decode().catch(() => {})));
  // Uma <img> por tela, já decodificada: o quadro só alterna visibilidade e posição.
  for (const [n, im] of Object.entries(cache)) {
    im.style.display = 'none';
    (n.startsWith('cel-') ? $('#phscreen') : $('#view')).appendChild(im);
  }
  cache['cel-res'].style.display = 'block'; cache['cel-juizo'].style.display = 'block';
  render(0); window.pronto = true;
}).catch((e) => { console.error('falhou ao carregar', e.message); });
</script>
</body>
