# Piloto no workspace de Leonardo. Reutiliza o Postgres 'ght4' já criado.
# A instância gratuita observada expira em 15/10/2026. Não é o plano definitivo.
services:
  - type: web
    name: ght4-agente
    runtime: docker
    plan: free
    region: virginia
    branch: feat/render-postgres
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node ferramentas/iniciar-render.mjs
    healthCheckPath: /api/saude
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ght4
          property: connectionString
      - key: PG_TLS_MODE
        value: disable
      - key: PG_POOL_MAX
        value: "5"
      - key: GHT4_CATALOGO_ORIGEM
        value: banco
      - key: GHT4_CONFIGURACAO_INICIAL
        value: "0"
